# Placeholders (requires PlaceholderAPI):
# %eco_balance_fixed%     -> 1000000.00
# %eco_balance_commas%    -> 1,000,000
# %eco_balance_formatted% -> $1,000,000
#
# The command is registered dynamically. Change this and run /ecoreload.
# Set to false to disable the configured command and aliases; /ecoreload remains available.
custom-commands-enabled: true
command: "economy"
# Separate multiple aliases with commas.
aliases: "eco"

# Appears before every formatted balance, e.g. $1,000,000
symbol: "$"

messages:
  no-permission: "&cYou do not have permission to do that."
  usage: "&cUsage: /{command} <balance|give|set|take|reset> [player] [amount]"
  invalid-amount: "&cAmount must be a positive number."
  reload: "&aEco configuration reloaded."
  balance: "&a{player}'s balance: &e{balance}"

  admin-give: "&aGave &e{amount} &ato &e{player}&a. New balance: &e{balance}"
  admin-set: "&aSet &e{player}&a's balance to &e{balance}"
  admin-take: "&aTook &e{amount} &afrom &e{player}&a. New balance: &e{balance}"
  admin-reset: "&aReset &e{player}&a's balance."

  player-give: "&aYou received &e{amount}&a. Your balance is now &e{balance}"
  player-set: "&aYour balance was set to &e{balance}"
  player-take: "&c{amount} was taken from your balance. New balance: &e{balance}"
  player-reset: "&cYour balance has been reset."
